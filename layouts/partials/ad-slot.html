{{- $adsense := .page.Site.Params.adsense }}
{{- if and $adsense.enabled $adsense.client (not .page.Params.canonicalURL) }}
	{{- $slotID := "" }}
	{{- with $adsense.slots }}{{ $slotID = index . $.slot }}{{ end }}
	{{- if $slotID }}
	<div class="ad-slot ad-slot--{{ .slot }}">
		<span class="ad-slot__label">Advertisement</span>
		<ins class="adsbygoogle"
			style="display:block"
			data-ad-client="{{ $adsense.client }}"
			data-ad-slot="{{ $slotID }}"
			data-ad-format="auto"
			data-full-width-responsive="true"></ins>
		<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
	</div>
	{{- end }}
{{- end }}
